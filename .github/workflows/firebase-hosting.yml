name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qoption-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Ali4760/qoption' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Check and build
        env:
          VITE_FIREBASE_REGION: ${{ vars.VITE_FIREBASE_REGION }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
        run: |
          npm run check
          npm run build
      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QOPTION_6C226 }}
          projectId: qoption-6c226
          channelId: live
          firebaseToolsVersion: 15.32.1
      - name: Check both entry points
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://qoption-6c226.web.app/ | grep -F 'Qoption'
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://qoption-6c226.web.app/advin | grep -F 'Admin panel'
